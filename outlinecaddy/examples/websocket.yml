---
logging:
  logs:
    default:
      level: ERROR # 要看详细日志 改为DEBUG
      encoder:
        format: console
apps:
  http:
    servers:
      '1':
        listen:
        - ":443"
        routes:
          #        - match:
          #          - host:
          #              - "os1.yingsun.dpdns.org"
          #            path:
          #              - "/"
          #          handle:
          #          - handler: static_response
          #            status_code: 200
          #            body: "OK"

        - match:
          - host:
              - "os1.yingsun.dpdns.org"
            path:
              - "/SECRET/tcp"  # Prevent probing by serving under a secret path.
          handle:
          - handler: websocket2layer4
            type: stream
            connection_handler: ss1
        - match:
          - host:
              - "os1.yingsun.dpdns.org"
            path:
              - "/SECRET/udp"  # Prevent probing by serving under a secret path.
          handle:
          - handler: websocket2layer4
            type: packet
            connection_handler: ss1

        # `trusted_proxies` defines the IP ranges of your trusted proxies.
        # Requests from these proxies will have their client IP determined by
        # incoming proxy headers specified in `client_ip_headers` below.
        trusted_proxies:
          source: static
          ranges:
            - 127.0.0.1
            - ::1
        client_ip_headers:
          - "X-Forwarded-For"
          - "X-Original-Forwarded-For"
          - "Forwarded-For"
          - "Forwarded"
          - "Client-IP"
          - "CF-Connecting-IP"
          - "X-Real-IP"
          - "X-Client-IP"
          - "True-Client-IP"

  layer4:
    servers:
      '1':
        listen:
        - tcp/[::]:9000 # 启动纯outline服务
        - udp/[::]:9000 # 启动纯outline服务
        - udp/[::]:443 # 为了wss+ss，客户端即使配置了tls+443 但是udp还是走纯ss协议，没有走wss+ss
        routes:
        - handle:
          - handler: outline
            connection_handler: ss1
  outline:
    shadowsocks:
      replay_history: 10000
    connection_handlers:
    - name: ss1
      handle:
        handler: shadowsocks
        keys:
        - id: user-0
          cipher: chacha20-ietf-poly1305
          secret: Secret0
        - id: user-1
          cipher: chacha20-ietf-poly1305
          secret: Secret1


