# WSS 示例配置 (使用 outlinecaddy)
# 需将 example.com 替换为你的真实域名
---
logging:
  logs:
    default:
      level: INFO
      encoder:
        format: console
apps:
  http:
    servers:
      'wss_server':
        listen:
        - ":443"
        routes:
        - match:
          - host:
            - example.com
          handle:
          - handler: subroute
            routes:
            - match:
              - path:
                - "/SECRET/tcp"  # WSS 路径 (TCP 流量)
              handle:
              - handler: websocket2layer4
                type: stream
                connection_handler: ss1
            - match:
              - path:
                - "/SECRET/udp"  # WSS 路径 (UDP 流量)
              handle:
              - handler: websocket2layer4
                type: packet
                connection_handler: ss1

  # (可选) 同时开启直连监听
  layer4:
    servers:
      'direct':
        listen:
        - tcp/[::]:9000
        - udp/[::]:9000
        routes:
        - handle:
          - handler: outline
            connection_handler: ss1

  outline:
    shadowsocks:
      replay_history: 10000
    connection_handlers:
    - name: ss1
      handle:
        handler: shadowsocks
        keys:
        - id: user-0
          cipher: chacha20-ietf-poly1305
          secret: Secret0
