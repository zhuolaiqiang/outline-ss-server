# WSS 示例配置 (使用 outlinecaddy)
# 需将 example.com 替换为你的真实域名
---
admin:
  disabled: true # 禁用 admin API 以避免端口 2019 冲突

logging:
  logs:
    default:
      level: INFO
      encoder:
        format: console
apps:
  tls:
    automation:
      policies:
        - subjects:
            - os1.yingsun.dpdns.org
          issuers:
            - module: zerossl # 切换到 ZeroSSL 避免 Let's Encrypt 速率限制
            - module: acme
              email: admin@yingsun.dpdns.org # 建议填写真实邮箱
  http:
    servers:
      "wss_server":
        listen:
          - ":443"
        routes:
          - match:
              - host:
                  - os1.yingsun.dpdns.org
            handle:
              - handler: subroute
                routes:
                  - match:
                      - path:
                          - "/wss/tcp" # WSS 路径 (TCP 流量)
                    handle:
                      - handler: websocket2layer4
                        type: stream
                        connection_handler: ss1
                  - match:
                      - path:
                          - "/wss/udp" # WSS 路径 (UDP 流量)
                    handle:
                      - handler: websocket2layer4
                        type: packet
                        connection_handler: ss1

  # (可选) 同时开启直连监听
  layer4:
    servers:
      "direct":
        listen:
          - tcp/[::]:9000
          - udp/[::]:9000
        routes:
          - handle:
              - handler: outline
                connection_handler: ss1

  outline:
    shadowsocks:
      replay_history: 10000
    connection_handlers:
      - name: ss1
        handle:
          handler: shadowsocks
          keys:
            - id: user-0
              cipher: chacha20-ietf-poly1305
              secret: Secret0
